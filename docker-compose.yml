version: "3"
services:
  scroll-id-dns-api:
    image: ktn-nft-api
    build:
      context: .
      dockerfile: Dockerfile-server

    restart: always
    volumes:
      - ./:/webapps
    ports:
      - 6006:5005
    networks:
      - base-network
    command: gunicorn --bind 0.0.0.0:5005 --workers=1 main:app --log-level=debug -c conf/gunicorn.py --timeout 0

  scroll-id-dns-domain-queue:
    image: ktn-nft-api
    build:
      context: .
      dockerfile: Dockerfile-server
    restart: always
    volumes:
      - ./:/webapps
    networks:
      - base-network
    command: celery --app worker worker -Q dns-domain-queue -l INFO -c 4

networks:
  base-network:
    external: true
